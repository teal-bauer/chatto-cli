version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/teal-bauer/chatto-cli/internal/pb
plugins:
  - local: protoc-gen-go
    out: ../../chatto-cli/internal/pb
    opt:
      - paths=source_relative
    include_imports: true
    types:
      - chatto.api.v1
      - chatto.admin.v1
      - chatto.auth.v1
      - chatto.discovery.v1
      - chatto.realtime.v1
  - local: protoc-gen-connect-go
    out: ../../chatto-cli/internal/pb
    opt:
      - paths=source_relative
    include_imports: true
    types:
      - chatto.api.v1
      - chatto.admin.v1
      - chatto.auth.v1
      - chatto.discovery.v1
      - chatto.realtime.v1
